name: Send urgent notices now

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (show what would be sent, send nothing)"
        type: boolean
        default: true
      only_me:
        description: "Test mode: send only to me, ignore the class list"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: hub-emails
  cancel-in-progress: false

jobs:
  urgent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save nodemailer@6
      - run: node scripts/send-reminders.js
        env:
          MODE: urgent
          DRY_RUN: ${{ inputs.dry_run }}
          ONLY_ME: ${{ inputs.only_me }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENTS: ${{ secrets.RECIPIENTS }}
          MY_EMAIL: ${{ secrets.MY_EMAIL }}
          DONE_URL: ${{ secrets.DONE_URL }}
          DONE_SECRET: ${{ secrets.DONE_SECRET }}
          REPLY_TO: ${{ secrets.REPLY_TO }}
